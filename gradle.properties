# JVM 参数：AGP 9 + Compose 编译需要足够堆内存
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# AndroidX 命名空间资源
android.useAndroidX=true
# Kotlin 官方代码风格
kotlin.code.style=official
# 每个库只包含自己声明的资源，减小 R 类体积
android.nonTransitiveRClass=true
# 构建缓存
org.gradle.caching=true
# 说明：AGP 9.2.1 的 ProcessNavigationXmlTask 存在配置缓存序列化问题，
# 本机构建关闭配置缓存（不影响项目可移植性）
org.gradle.configuration-cache=false
# backdrop 模块上游配置：Compose macOS 实验目标
org.jetbrains.compose.experimental.macos.enabled=true

# 【运行纪律 2026-09-17】并发代理太多时构建会把整机压垮（曾见 load 33）
# ⇒ 限制同时干活的 worker 数与并行度，换稳定性（用户要求"保证电脑稳定运行"）
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=true
